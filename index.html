<style>body {
    font-family: "IBM Plex Sans", sans-serif;
    background-color: #11131b
    }
.glass-panel {
    background: rgba(30, 30, 30, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8)
    }
.hero-bg {
    background-image: linear-gradient(rgba(17, 19, 27, 0.8), rgba(17, 19, 27, 0.9)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuBbPm3fRfGc_SlhNfaI6liWytBdv0Pkeh5YtDwKDcR7xxTe1_eFRjHRtW2qXtqN9e4CIusmXumCQKs7NvoxUpp4Lf-KJxpeXbX4xrN8bR5FpwQGpGptaATZZydoJRSu8Sjx4rKafANvKdohZ9zk2Rj6qPAlXkNQFZ6GGhGSK_rrXfmQPJm6hi5IDR42onbWft1ebCy4aZUolXB8VoaoBx8XD5aONl-nPT3vH9GuvExxFWkyGq-kHkIyIIzKPv9WDo5yp1Fh0PxTGwlY);
    background-size: cover;

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Hero Background Layer -->
<div class="fixed inset-0 z-0 hero-bg" data-alt="A high-performance luxury sports car dashboard at night, featuring glowing digital interfaces and neon blue accents. The lighting is moody and cinematic, with soft bokeh from city lights in the background. The aesthetic is ultra-modern and technical, emphasizing precision engineering and automotive excellence in a dark-mode palette."></div>
<!-- Navigation-less Header for Transactional Screen -->
<header class="relative z-10 w-full flex justify-between items-center px-container-padding py-gutter">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[32px]">precision_manufacturing</span>
<span class="font-display-lg text-title-sm text-primary font-bold tracking-tight">SAIP Automotive</span>
</div>
<!-- Language Switcher -->
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">language</span>
<span>EN / AR</span>
</button>
</div>
</header>
<!-- Main Login Canvas -->
<main class="relative z-10 flex-grow flex items-center justify-center px-gutter">
<div class="w-full max-w-[440px] glass-panel rounded-xl p-10 flex flex-col gap-8">
<!-- Identity Section -->
<div class="text-center space-y-2">
<h1 class="font-headline-md text-headline-md text-on-surface">Sign In</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Automotive Management System</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Username/Email Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1" for="identity">EMAIL OR USERNAME</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors">account_circle</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-base text-body-base outline-none" id="identity" placeholder="j.doe@saip.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">PASSWORD</label>
<a class="font-label-caps text-[10px] text-primary hover:underline transition-all" href="#">FORGOT PASSWORD?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-base text-body-base outline-none" id="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-outline hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</div>
</div>
</div>
<!-- Security & Submission -->
<div class="flex items-center justify-between py-2">
<label class="flex items-center cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded-md border border-outline-variant bg-surface-container-lowest checked:bg-primary checked:border-primary transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[14px] left-1 opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="ml-3 font-body-dense text-body-dense text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me on this device</span>
</label>
</div>
<button class="w-full py-4 bg-primary-container text-on-primary-container font-headline-md text-[16px] rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex justify-center items-center gap-2 shadow-lg shadow-primary-container/20" type="submit">
<span>Secure Login</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Diagnostic Info Footer -->
<div class="mt-4 pt-6 border-t border-outline-variant flex flex-col gap-4">
<div class="flex items-center justify-center gap-6">
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
<span class="font-label-caps text-[10px] text-on-surface-variant">DIAGNOSTICS: ONLINE</span>
</div>
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-caps text-[10px] text-on-surface-variant">ENC: AES-256</span>
</div>
</div>
</div>
</div>
</main>
<!-- System Footer -->
<footer class="relative z-10 py-gutter px-container-padding flex justify-between items-end">
<div class="space-y-1">
<p class="font-label-caps text-[10px] text-outline">© 2024 SAIP AUTOMOTIVE INTEGRATED PLATFORM</p>
<p class="font-label-caps text-[10px] text-outline-variant">SYSTEM VERSION: 4.2.1-STABLE</p>
</div>
<div class="flex gap-4">
<a class="font-label-caps text-[10px] text-outline hover:text-primary transition-colors" href="#">PRIVACY POLICY</a>
<a class="font-label-caps text-[10px] text-outline hover:text-primary transition-colors" href="#">SECURITY AUDIT</a>
</div>
</footer>
</body></html>
